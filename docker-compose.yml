# One command for everything:  docker compose up --build
# App: http://localhost:3000   API docs: http://localhost:8080/swagger-ui.html
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    ports:
      - "127.0.0.1:5434:5432"   # host port 5434 so it doesn't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/taskflow   # service name, container port
      DB_USERNAME: taskflow
      DB_PASSWORD: taskflow
      # Set JWT_SECRET in your shell or a .env file for anything beyond local use.
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-local-compose-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres accepts connections, not just "started"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy   # nginx forwards /api to it

volumes:
  pgdata:
