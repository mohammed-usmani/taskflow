# Local dev database. Later this file also gets the backend and frontend services.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    ports:
      - "127.0.0.1:5434:5432"   # 5432/5433 are taken by your other projects
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
