# ${NAME:default} = read env var NAME, fall back to the default.
# Defaults are for local dev only; real deployments set the env vars.
spring:
  application:
    name: taskflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow}
  jpa:
    open-in-view: false          # no lazy loading from controllers; load what you need in the service
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks entities match it
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true                # runs src/main/resources/db/migration/V*.sql on startup

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_DEMO_DATA:true}   # creates the demo user + project on startup (idempotent)

management:
  endpoints:
    web:
      exposure:
        include: health                # only /actuator/health; nothing else exposed
