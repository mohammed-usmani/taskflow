server {
    listen 80;
    root /usr/share/nginx/html;

    # Same job as Vite's dev proxy: the browser only talks to this server,
    # so the app uses relative /api URLs and there is no CORS to configure.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Client-side routing: /projects/5 isn't a file, so serve index.html and let React Router handle it.
    location / {
        try_files $uri /index.html;
    }

    # Built assets have content hashes in their names, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
